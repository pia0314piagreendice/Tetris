<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SLIT Puzzle</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #222;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    touch-action: none;
    overflow: hidden;
  }
  
  #title-logo {
    display: flex;
    gap: 15px;
    margin-top: 10px;
    margin-bottom: 5px;
  }
  .title-mino {
    width: 30px;
    height: 30px;
  }

  #riddle-container {
    width: 90%;
    max-width: 320px;
    background: #333;
    padding: 6px 10px;
    border-radius: 8px;
    text-align: center;
    border: 2px solid #ccc;
    margin-bottom: 5px;
  }
  #riddle-title {
    font-size: 12px;
    color: #ccc;
  }
  #riddle-text {
    font-size: 15px;
    font-weight: bold;
    color: #fff;
  }
  
  #game-layout {
    display: flex;
    gap: 10px;
    align-items: flex-end; 
  }

  #board-container {
    position: relative;
    height: 404px; 
  }
  canvas#board {
    background-color: #000;
    border: 2px solid #555;
    display: block;
    box-sizing: content-box;
  }
  
  #target-area {
    position: absolute;
    left: 0;
    background-color: rgba(255, 0, 0, 0.25);
    border-top: 1px dashed rgba(255, 0, 0, 0.5);
    border-bottom: 1px dashed rgba(255, 0, 0, 0.5);
    pointer-events: none;
    display: none;
  }

  #side-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end; 
    width: 70px;
    height: 404px; 
  }
  
  #next-container {
    margin-bottom: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .next-label {
    font-size: 11px;
    margin-bottom: 3px;
    color: #aaa;
  }
  canvas#next-box {
    background: #111;
    border: 2px solid #555;
    border-radius: 4px;
    width: 100%;
  }
  
  #reset-btns {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .btn-reset {
    background: #c0392b;
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 6px 2px;
    border-radius: 6px;
    line-height: 1.3;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-reset:active { background: #e74c3c; }
  
  #controls {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 90%;
    max-width: 280px;
  }
  .btn {
    background: #444;
    border: none;
    color: white;
    padding: 12px 0;
    font-size: 18px;
    border-radius: 8px;
    user-select: none;
    touch-action: manipulation;
  }
  .btn:active { background: #666; }
  .grid-blank { visibility: hidden; }

  #message-window {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10, 10, 10, 0.95);
    border: 2px solid #f39c12;
    padding: 15px 20px;
    border-radius: 10px;
    text-align: center;
    z-index: 100;
    display: none;
    width: 80%;
    max-width: 280px;
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
  }
  #message-text {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  #message-btn {
    background: #f39c12;
    color: #000;
    border: none;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="title-logo">
  <canvas id="logo-S" class="title-mino" style="transform: rotate(-45deg);"></canvas>
  <canvas id="logo-L" class="title-mino" style="transform: rotate(90deg);"></canvas>
  <canvas id="logo-I" class="title-mino" style="transform: rotate(90deg);"></canvas>
  <canvas id="logo-T" class="title-mino" style="transform: rotate(180deg);"></canvas>
</div>

<div id="riddle-container">
  <div id="riddle-title">STAGE</div>
  <div id="riddle-text"></div>
</div>

<div id="game-layout">
  <div id="board-container">
    <canvas id="board" width="200" height="400"></canvas>
    <div id="target-area"></div>
  </div>
  <div id="side-panel">
    <div id="next-container">
      <div class="next-label">NEXT</div>
      <canvas id="next-box" width="60" height="180"></canvas>
    </div>
    <div id="reset-btns">
      <button class="btn-reset" id="btn-reset-stage">このステージ<br>リセット</button>
      <button class="btn-reset" id="btn-reset-all">ステージ１から<br>リセット</button>
    </div>
  </div>
</div>

<div id="controls">
  <button class="btn" id="btn-left">←</button>
  <button class="btn" id="btn-rotate">↻</button>
  <button class="btn" id="btn-right">→</button>
  <div class="grid-blank"></div>
  <button class="btn" id="btn-down">↓</button>
  <button class="btn" id="btn-drop">⏬</button>
</div>

<div id="message-window">
  <div id="message-text"></div>
  <button id="message-btn">次へ</button>
</div>

<script>
const SHAPES = {
  'I': { shape: [[1,1,1,1]], color: '#00ffff' },
  'J': { shape: [[1,0,0],[1,1,1]], color: '#0000ff' },
  'L': { shape: [[0,0,1],[1,1,1]], color: '#ffa500' },
  'O': { shape: [[1,1],[1,1]], color: '#ffff00' },
  'S': { shape: [[0,1,1],[1,1,0]], color: '#00ff00' },
  'T': { shape: [[0,1,0],[1,1,1]], color: '#800080' },
  'Z': { shape: [[1,1,0],[0,1,1]], color: '#ff0000' }
};
const COLORS = [null, '#00ffff', '#0000ff', '#ffa500', '#ffff00', '#00ff00', '#800080', '#ff0000'];

// ==========================================
// 💡 全体をみた上で、赤エリアの指定段に存在する同色エッジをカウントする究極のロジック
// ==========================================
// maxX: 判定対象の最大Xインデックス (通常は9, EXステージの右1マス除外なら8)
function countColorEdges(b, startY, endY, color, maxX = 9) {
  let v = 0; // 縦エッジ (左右の隣接)
  for (let y = startY; y <= endY; y++) {
    for (let x = 0; x < maxX; x++) {
      if (b[y][x].color === color && b[y][x+1].color === color) {
        v++;
      }
    }
  }

  let h = 0; // 横エッジ (上下の隣接。全体を見て赤エリアの境界を跨ぐものもカウント)
  for (let y = startY; y <= endY + 1; y++) {
    for (let x = 0; x <= maxX; x++) {
      let c1 = (y - 1 >= 0) ? b[y-1][x].color : 0;
      let c2 = (y < 20) ? b[y][x].color : 0;
      if (c1 === color && c2 === color) {
        h++;
      }
    }
  }
  return { v, h };
}

// 順序判定用: 指定された色の最小X座標を取得する
function getMinX(b, startY, endY, color) {
  let minX = 10;
  for (let y = startY; y <= endY; y++) {
    for (let x = 0; x < 10; x++) {
      if (b[y][x].color === color) minX = Math.min(minX, x);
    }
  }
  return minX;
}

// ------------------------------------------
// 🧩 各ステージの判定ロジック (全ステージをエッジカウントで統一)
// ------------------------------------------

function checkStage1(b) {
  // 水色(1)が赤エリア(17, 18)に存在
  let e = countColorEdges(b, 17, 18, 1);
  if (e.v !== 0 || e.h < 4) return false; // ミミは縦エッジ0、横エッジは上下に繋がっているため4本以上
  
  let xs = new Set();
  for(let y=17; y<=18; y++) {
    for(let x=0; x<10; x++) {
      if(b[y][x].color === 1) xs.add(x);
    }
  }
  if (xs.size !== 2) return false;
  let arr = Array.from(xs);
  return Math.abs(arr[0] - arr[1]) > 1; // 2本が離れていること
}

function checkStage2(b) {
  let e = countColorEdges(b, 17, 18, 1);
  if (e.v !== 2 || e.h < 4) return false; // オウは2本くっついているため縦エッジが2本
  
  let xs = new Set();
  for(let y=17; y<=18; y++) {
    for(let x=0; x<10; x++) {
      if(b[y][x].color === 1) xs.add(x);
    }
  }
  if (xs.size !== 2) return false;
  let arr = Array.from(xs);
  return Math.abs(arr[0] - arr[1]) === 1; // 2本が隣接していること
}

// ステージ3と4の共通判定 (コーラ)
function checkColaStage(b, targetRows) {
  let sY = Math.min(...targetRows);
  let eY = Math.max(...targetRows);
  
  let eT = countColorEdges(b, sY, eY, 6); // T(紫)
  let eJ = countColorEdges(b, sY, eY, 2); // J(青)
  let eL = countColorEdges(b, sY, eY, 3); // L(橙)

  // ①Tの色: 縦1, 横2
  if (eT.v !== 1 || eT.h !== 2) return false;
  // ②Jの色: 縦0, 横1
  if (eJ.v !== 0 || eJ.h !== 1) return false;
  // ③Lの色: 縦1, 横2
  if (eL.v !== 1 || eL.h !== 2) return false;

  // 順番: 左から T, J, L
  let minX_T = getMinX(b, sY, eY, 6);
  let minX_J = getMinX(b, sY, eY, 2);
  let minX_L = getMinX(b, sY, eY, 3);

  return (minX_T < minX_J && minX_J < minX_L);
}

function checkStage5(b) {
  // 紫(6) と 黄(4)
  let eT = countColorEdges(b, 17, 18, 6);
  let eO = countColorEdges(b, 17, 18, 4);

  // T2つ分で 縦3、横3 になる
  if (eT.v !== 3 || eT.h !== 3) return false;
  // Oは2x2なので 縦2、横2 になる
  if (eO.v !== 2 || eO.h !== 2) return false;
  
  let minX_T = getMinX(b, 17, 18, 6);
  let minX_O = getMinX(b, 17, 18, 4);
  return minX_T < minX_O;
}

function checkStage6(b) {
  // 紫(6), 黄(4), 赤(7)
  let eT = countColorEdges(b, 18, 19, 6);
  let eO = countColorEdges(b, 18, 19, 4);
  let eZ = countColorEdges(b, 18, 19, 7);

  // T2つ分で 縦3、横3
  if (eT.v !== 3 || eT.h !== 3) return false;
  // 黄色(O)が上に2つ -> 縦1, 横0
  if (eO.v !== 1 || eO.h !== 0) return false;
  // 赤色(Z)が下に2つ -> 縦1, 横0
  if (eZ.v !== 1 || eZ.h !== 0) return false;

  // 重なりチェック: 黄色と赤色が同じX座標に2つずつあるか
  let oXs = [], zXs = [];
  for(let x=0; x<10; x++) {
    if(b[18][x].color === 4) oXs.push(x);
    if(b[19][x].color === 7) zXs.push(x);
  }
  if(oXs.length !== 2 || zXs.length !== 2) return false;
  if(oXs[0] !== zXs[0] || oXs[1] !== zXs[1]) return false;

  let minX_T = getMinX(b, 18, 19, 6);
  return minX_T < oXs[0];
}

function checkStageEX(b) {
  // 赤エリア(17, 18) 右端1列除外なので maxX = 8
  let eP = countColorEdges(b, 17, 18, 6, 8); // 紫(T)
  let eB = countColorEdges(b, 17, 18, 2, 8); // 青(J)
  let eO = countColorEdges(b, 17, 18, 3, 8); // 橙(L)
  let eG = countColorEdges(b, 17, 18, 5, 8); // 緑(S)

  // 画像から算出した正確なエッジ数と完全一致するか
  if (eP.v !== 1 || eP.h !== 1) return false;
  if (eB.v !== 4 || eB.h !== 4) return false;
  if (eO.v !== 4 || eO.h !== 1) return false;
  if (eG.v !== 1 || eG.h !== 1) return false;

  return true;
}

const STAGES = [
  {
    title: "ミミを作ろう！",
    sequence: ['I', 'I'],
    targetRows: [2, 3],
    check: (b) => checkStage1(b)
  },
  {
    title: "オウを作ろう！",
    sequence: ['I', 'I'],
    targetRows: [2, 3],
    check: (b) => checkStage2(b)
  },
  {
    title: "コーラを作ろう！",
    sequence: ['T', 'J', 'L'],
    targetRows: [2, 3],
    check: (b) => checkColaStage(b, [2, 3])
  },
  {
    title: "コーラを作ろう！！",
    sequence: ['T', 'L', 'J'],
    targetRows: [1, 2],
    check: (b) => checkColaStage(b, [1, 2])
  },
  {
    title: "カットを作ろう！",
    sequence: ['I', 'I', 'O', 'T', 'T'],
    targetRows: [2, 3],
    check: (b) => checkStage5(b)
  },
  {
    title: "カットを大文字で作ろう！",
    sequence: ['I', 'I', 'Z', 'O', 'T', 'T'],
    targetRows: [1, 2],
    check: (b) => checkStage6(b)
  },
  {
    title: "切ルを作ろう！",
    sequence: ['S', 'S', 'J', 'L', 'J', 'L', 'J', 'J', 'L', 'T', 'I', 'S', 'J'],
    targetRows: [2, 3], 
    check: (b) => checkStageEX(b)
  }
];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-box');
const nextCtx = nextCanvas.getContext('2d');
const BLOCK_SIZE = 20;

let board, currentPiece, currentX, currentY;
let sequenceIndex = 0;
let pieceCounter = 0;
let dropCounter = 0;
let lastTime = 0;
let gameOver = false;
let isUpdating = false;
let currentStageIndex = 0;

function drawLogoMino(id, type, color, scale) {
  const c = document.getElementById(id);
  const cx = c.getContext('2d');
  const matrix = SHAPES[type].shape;
  c.width = 30; c.height = 30;
  cx.fillStyle = color;
  const offsetX = (c.width - matrix[0].length * scale) / 2;
  const offsetY = (c.height - matrix.length * scale) / 2;
  matrix.forEach((row, y) => {
    row.forEach((val, x) => {
      if (val) {
        cx.fillRect(offsetX + x * scale, offsetY + y * scale, scale - 1, scale - 1);
      }
    });
  });
}
drawLogoMino('logo-S', 'S', '#00ff00', 8);
drawLogoMino('logo-L', 'L', '#ffa500', 8);
drawLogoMino('logo-I', 'I', '#00ffff', 8);
drawLogoMino('logo-T', 'T', '#800080', 8);

function initStage(stageIndex) {
  currentStageIndex = stageIndex;
  const stage = STAGES[currentStageIndex];
  
  if (currentStageIndex === STAGES.length - 1) {
    document.getElementById('riddle-title').innerText = `EX STAGE`;
  } else {
    document.getElementById('riddle-title').innerText = `STAGE ${currentStageIndex + 1}`;
  }
  document.getElementById('riddle-text').innerText = stage.title;
  
  board = Array.from({length: 20}, () => Array(10).fill(null).map(() => ({color: 0, id: 0})));
  sequenceIndex = 0;
  pieceCounter = 0;
  dropCounter = 0;
  gameOver = false;
  
  const targetArea = document.getElementById('target-area');
  const maxRow = Math.max(...stage.targetRows);
  const minRow = Math.min(...stage.targetRows);
  const rowsCount = maxRow - minRow + 1;
  
  targetArea.style.display = 'block';
  targetArea.style.bottom = 'auto';
  targetArea.style.top = `${(20 - maxRow) * BLOCK_SIZE + 1}px`;
  targetArea.style.height = `${rowsCount * BLOCK_SIZE + 3}px`;

  // EXステージのみ右端1マスを赤エリアから外す
  if (currentStageIndex === STAGES.length - 1) {
    targetArea.style.width = `${canvas.width - BLOCK_SIZE}px`; 
  } else {
    targetArea.style.width = '100%';
  }

  hideMessage();
  spawnPiece();

  if (!isUpdating) {
    lastTime = performance.now();
    update();
  }
}

function spawnPiece() {
  if (sequenceIndex >= STAGES[currentStageIndex].sequence.length) {
    checkWin();
    return;
  }
  const type = STAGES[currentStageIndex].sequence[sequenceIndex++];
  pieceCounter++;
  currentPiece = {
    type: type,
    id: pieceCounter,
    matrix: SHAPES[type].shape,
    colorIndex: Object.keys(SHAPES).indexOf(type) + 1
  };
  currentX = Math.floor((10 - currentPiece.matrix[0].length) / 2);
  currentY = 0;
  
  if (collide(board, currentPiece)) {
    gameOver = true;
    showMessage("何かが違うようです…", false);
  }
  drawNext();
}

function drawNext() {
  nextCtx.fillStyle = '#111';
  nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  const stage = STAGES[currentStageIndex];
  
  for (let i = 0; i < 3; i++) {
    const idx = sequenceIndex + i;
    if (idx < stage.sequence.length) {
      const nextType = stage.sequence[idx];
      const matrix = SHAPES[nextType].shape;
      const color = SHAPES[nextType].color;
      const scale = 10;
      const offsetX = (nextCanvas.width - matrix[0].length * scale) / 2;
      const offsetY = i * 60 + (60 - matrix.length * scale) / 2;
      
      nextCtx.fillStyle = color;
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            nextCtx.fillRect(offsetX + x * scale, offsetY + y * scale, scale - 1, scale - 1);
          }
        });
      });
    }
  }
}

function collide(b, p, testX = currentX, testY = currentY) {
  const m = p.matrix;
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0) {
        if (testY + y >= 20 || testX + x < 0 || testX + x >= 10 || 
           (b[testY + y] && b[testY + y][testX + x].color !== 0)) {
          return true;
        }
      }
    }
  }
  return false;
}

function merge(b, p) {
  p.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        b[y + currentY][x + currentX] = { color: p.colorIndex, id: p.id };
      }
    });
  });
}

function rotate(m) {
  return m[0].map((val, index) => m.map(row => row[index]).reverse());
}

function playerRotate() {
  if (gameOver) return;
  const orig = currentPiece.matrix;
  currentPiece.matrix = rotate(currentPiece.matrix);
  if (collide(board, currentPiece)) currentPiece.matrix = orig;
}

function playerMove(dir) {
  if (gameOver) return;
  if (!collide(board, currentPiece, currentX + dir, currentY)) {
    currentX += dir;
  }
}

function playerDrop() {
  if (gameOver) return;
  if (!collide(board, currentPiece, currentX, currentY + 1)) {
    currentY++;
  } else {
    merge(board, currentPiece);
    clearLines();
    spawnPiece();
  }
  dropCounter = 0;
}

function hardDrop() {
  if (gameOver) return;
  while (!collide(board, currentPiece, currentX, currentY + 1)) {
    currentY++;
  }
  merge(board, currentPiece);
  clearLines();
  spawnPiece();
  dropCounter = 0;
}

function clearLines() {
  outer: for (let y = board.length - 1; y >= 0; --y) {
    for (let x = 0; x < board[y].length; ++x) {
      if (board[y][x].color === 0) continue outer;
    }
    const row = board.splice(y, 1)[0];
    const newRow = Array.from({length: 10}, () => ({color: 0, id: 0}));
    board.unshift(newRow);
    ++y;
  }
}

function checkWin() {
  gameOver = true;
  const stage = STAGES[currentStageIndex];
  if (stage.check(board)) {
    if (currentStageIndex === STAGES.length - 1) {
      showMessage("🎉 全ての謎が解けました！", true);
    } else {
      showMessage("CLEAR!", true);
    }
  } else {
    showMessage("何かが違うようです…", false);
  }
}

function showMessage(text, isClear) {
  const win = document.getElementById('message-window');
  const btn = document.getElementById('message-btn');
  document.getElementById('message-text').innerText = text;
  document.getElementById('message-text').style.color = isClear ? "#00ff00" : "#ff3333";
  
  if (isClear && currentStageIndex === STAGES.length - 1) {
    btn.style.display = 'none';
  } else if (!isClear) {
    btn.style.display = 'none';
  } else {
    btn.style.display = 'inline-block';
    btn.innerText = "次のステージへ";
    btn.onclick = () => {
      currentStageIndex++;
      initStage(currentStageIndex);
    };
  }
  win.style.display = 'block';
}

function hideMessage() {
  document.getElementById('message-window').style.display = 'none';
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  board.forEach((row, y) => {
    row.forEach((cell, x) => {
      if (cell.color !== 0) {
        ctx.fillStyle = COLORS[cell.color];
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
      }
    });
  });

  if (currentPiece && !gameOver) {
    let ghostY = currentY;
    while (!collide(board, currentPiece, currentX, ghostY + 1)) {
      ghostY++;
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    currentPiece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          ctx.fillRect((currentX + x) * BLOCK_SIZE, (ghostY + y) * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
        }
      });
    });

    ctx.fillStyle = COLORS[currentPiece.colorIndex];
    currentPiece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          ctx.fillRect((currentX + x) * BLOCK_SIZE, (currentY + y) * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
        }
      });
    });
  }
}

function update(time = 0) {
  if (gameOver) {
    draw();
    isUpdating = false;
    return;
  }
  isUpdating = true;
  const deltaTime = time - lastTime;
  lastTime = time;
  dropCounter += deltaTime;

  if (dropCounter > 1000) {
    playerDrop();
  }

  draw();
  requestAnimationFrame(update);
}

const bindTouch = (id, fn) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); });
  el.addEventListener('click', (e) => { fn(); });
};

bindTouch('btn-left', () => playerMove(-1));
bindTouch('btn-right', () => playerMove(1));
bindTouch('btn-rotate', () => playerRotate());
bindTouch('btn-down', () => playerDrop());
bindTouch('btn-drop', () => hardDrop());

bindTouch('btn-reset-stage', () => initStage(currentStageIndex));
bindTouch('btn-reset-all', () => initStage(0));

document.addEventListener('keydown', event => {
  if (gameOver) return;
  if (event.keyCode === 37) playerMove(-1);
  else if (event.keyCode === 39) playerMove(1);
  else if (event.keyCode === 40) playerDrop();
  else if (event.keyCode === 38) playerRotate();
  else if (event.keyCode === 32) hardDrop();
});

initStage(0);
</script>
</body>
</html>
